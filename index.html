<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physik Portal</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0d1117;
    color:white;
    text-align:center;
}

header{
    padding:40px 20px;
}

h1{
    font-size:3rem;
}

p{
    color:#8b949e;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:15px;
    padding:30px;
    text-decoration:none;
    color:white;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#58a6ff;
    box-shadow:0 0 15px rgba(88,166,255,0.4);
}

.icon{
    font-size:4rem;
}

.card h2{
    margin-top:15px;
}

.card p{
    font-size:0.95rem;
}
</style>
</head>

<body>

<header>
    <h1>⚛️ Physik Portal</h1>
    <p>Wähle einen Bereich aus</p>
</header>

<div class="container">

    <a class="card" href="physikgame.html">
        <div class="icon">🎮</div>
        <h2>Physik Spiel</h2>
        <p>Spiele und Quizfragen zu Physik.</p>
    </a>

    <a class="card" href="waermeaufgaben.html">
        <div class="icon">🌡️</div>
        <h2>Wärmeaufgaben</h2>
        <p>Aufgaben zur Wärmelehre und Temperatur.</p>
    </a>

</div>

</body>
</html>
